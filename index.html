<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四字熟語クイズ | ことばの花びら</title><style>:root{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#594450}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 10%,#fff 0,#ffeaf2 55%,#f9d9e8 100%);display:grid;place-items:center;padding:20px}.app{background:#fffdfef2;max-width:620px;width:100%;border-radius:28px;box-shadow:0 18px 60px #bd799744;padding:32px}h1{font-size:clamp(25px,5vw,35px);color:#b84f7c;margin:5px 0 10px}.sub{color:#957784}.pill{display:inline-block;background:#ffe3ed;border-radius:30px;padding:7px 15px;color:#b84f7c;font-size:13px;font-weight:bold}.bar{height:9px;background:#f7e6ed;border-radius:10px;overflow:hidden;margin:20px 0}.fill{height:100%;background:#e88eb3;width:0;transition:width .3s}.word{font-size:clamp(31px,8vw,46px);font-weight:800;letter-spacing:.12em;text-align:center;margin:26px 0 10px;color:#8d3c64}.question{text-align:center;margin-bottom:22px}.answers{display:grid;gap:11px}.answers button,.main{width:100%;border:2px solid #f5cddd;background:white;color:#664957;border-radius:15px;padding:15px;text-align:left;font-size:16px;cursor:pointer;transition:.15s}.answers button:hover:not(:disabled){background:#fff0f5;transform:translateY(-1px)}.answers button.correct{background:#dff5e8;border-color:#75c79c}.answers button.wrong{background:#ffe1e6;border-color:#e58e9f}.answers button:disabled{cursor:default}.main{background:#ce6995;color:white;border:0;text-align:center;font-weight:bold;margin-top:16px}.main:hover{background:#b8527f}.feedback{background:#fff0f6;border-radius:15px;padding:15px;margin-top:18px;line-height:1.8}.hidden{display:none}.small{font-size:13px;color:#957784;text-align:center;margin-top:25px}.score{font-size:50px;font-weight:bold;color:#b84f7c;text-align:center;margin:30px 0 10px}.center{text-align:center}</style></head><body><main class="app"><span class="pill">🌷 学んで楽しい！</span><h1>ことばの花びら</h1><p class="sub">四字熟語の意味、いくつ知ってる？</p><section id="intro"><p>全10問の四択クイズに挑戦！ 正解を選ぶと、意味や使い方も学べるよ。</p><button class="main" id="start">クイズをはじめる ♡</button></section><section id="game" class="hidden"><div id="progressText" class="sub"></div><div class="bar"><div class="fill" id="fill"></div></div><div class="word" id="word"></div><p class="question">この四字熟語の意味は？</p><div class="answers" id="answers"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><button class="main hidden" id="next">次の問題へ →</button></section><section id="result" class="hidden"><div class="score" id="score"></div><p class="center" id="message"></p><button class="main" id="restart">もう一度チャレンジ ♡</button></section><p class="small">AIを活用して制作した学習用Webクイズ 🌸</p></main><script>const data=[{w:'一期一会',a:'一生に一度の出会いを大切にすること',o:['一生に一度の出会いを大切にすること','同じことを何度も繰り返すこと','大勢の人が一か所に集まること','長い時間をかけて努力すること'],e:'「一期」は一生、「一会」は一度の出会い。人との出会いを大切にする気持ちを表します。'},{w:'十人十色',a:'人それぞれ考え方や好みが異なること',o:['みんなで同じ目標を目指すこと','人それぞれ考え方や好みが異なること','十人が順番に意見を述べること','多くの人が協力して働くこと'],e:'人の個性や価値観はそれぞれ違う、という意味です。'},{w:'一石二鳥',a:'一つの行動で二つの利益を得ること',o:['小さな努力を積み重ねること','一度失敗してから成功すること','一つの行動で二つの利益を得ること','二つの選択肢で迷うこと'],e:'一つの石で二羽の鳥を得ることから、ひとつの行動で二つの成果を得る意味です。'},{w:'温故知新',a:'昔のことを学び新しい知識や考えを得ること',o:['昔の習慣をすべて守ること','新しいものだけを大切にすること','過去の失敗を忘れること','昔のことを学び新しい知識や考えを得ること'],e:'「故きを温ねて新しきを知る」。歴史や経験から新しい発見をすることです。'},{w:'試行錯誤',a:'試しと失敗を繰り返し解決方法を探すこと',o:['試しと失敗を繰り返し解決方法を探すこと','何も考えずに決断すること','他人の意見だけに従うこと','同じ方法を変えずに続けること'],e:'いろいろな方法を試しながら、よりよい答えを見つけることです。'},{w:'以心伝心',a:'言葉にしなくても気持ちが通じ合うこと',o:['手紙で気持ちを伝えること','言葉にしなくても気持ちが通じ合うこと','一人でじっくり考えること','意見がまったく合わないこと'],e:'言葉や文字を使わずに、互いの気持ちが伝わることです。'},{w:'臨機応変',a:'状況に合わせて適切に対応すること',o:['決めた予定を必ず守ること','何事も先延ばしにすること','状況に合わせて適切に対応すること','誰に対しても同じ返事をすること'],e:'その場の変化に合わせて柔軟に行動することを表します。'},{w:'切磋琢磨',a:'互いに励まし合い能力を高めること',o:['一人で静かに休むこと','細かいことを気にしないこと','競争を避けて過ごすこと','互いに励まし合い能力を高めること'],e:'仲間同士で刺激し合い、学問や技術、人間性などを磨くことです。'},{w:'七転八起',a:'何度失敗しても立ち上がること',o:['何度失敗しても立ち上がること','七回挑戦したらやめること','落ち着かず動き回ること','すべてを運に任せること'],e:'「七転び八起き」ともいい、失敗に負けず努力する姿勢を表します。'},{w:'自業自得',a:'自分の行いの結果を自分で受けること',o:['誰かの努力で成功すること','自分の行いの結果を自分で受けること','他人の失敗を助けること','偶然よいことが起きること'],e:'自分がした行いの報いを自分自身が受けること。一般には悪い結果について使われます。'}];let questions=[],idx=0,points=0;const el=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(){questions=shuffle(data);idx=0;points=0;el('intro').classList.add('hidden');el('result').classList.add('hidden');el('game').classList.remove('hidden');render()}function render(){const q=questions[idx];el('progressText').textContent=`第 ${idx+1} 問 / ${questions.length} 問`;el('fill').style.width=`${idx/questions.length*100}%`;el('word').textContent=q.w;el('feedback').classList.add('hidden');el('next').classList.add('hidden');el('answers').replaceChildren();shuffle(q.o).forEach(option=>{const b=document.createElement('button');b.textContent=option;b.onclick=()=>answer(option,b);el('answers').append(b)})}function answer(value,clicked){const q=questions[idx],ok=value===q.a;if(ok)points++;[...el('answers').children].forEach(b=>{b.disabled=true;if(b.textContent===q.a)b.classList.add('correct');else if(b===clicked)b.classList.add('wrong')});el('feedback').textContent=(ok?'🌸 正解！':'💭 おしい！ 正解は「'+q.a+'」')+' '+q.e;el('feedback').classList.remove('hidden');el('next').classList.remove('hidden');el('fill').style.width=`${(idx+1)/questions.length*100}%`;el('next').textContent=idx===questions.length-1?'結果を見る →':'次の問題へ →'}function next(){idx++;if(idx<questions.length)render();else{el('game').classList.add('hidden');el('result').classList.remove('hidden');el('score').textContent=`${points} / ${questions.length} 点`;el('message').textContent=points===10?'満点！ 四字熟語マスターだね 🌸':points>=7?'すごい！ かなり詳しいね 💗':'おつかれさま！ 解説を復習してもう一度挑戦しよう 🌷'}}el('start').onclick=start;el('restart').onclick=start;el('next').onclick=next;</script></body></html>
